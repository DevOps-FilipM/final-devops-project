name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  # ============================================
  # JOB 1: Build i publikacja obrazu Docker
  # Uruchamia sie na kazdym commicie
  # ============================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Send email on build failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: email-smtp.eu-central-1.amazonaws.com
          server_port: 587
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          subject: "❌ Build FAILED - ${{ github.repository }}"
          body: |
            Build failed for commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: devops@${{ secrets.SES_DOMAIN }}

  # ============================================
  # JOB 2: Deploy na EC2
  # Uruchamia sie TYLKO na commicie do main
  # ============================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pobranie najnowszego obrazu
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

            # Zatrzymanie starego kontenera
            docker stop todo-app || true
            docker rm todo-app || true

            # Uruchomienie nowego kontenera
            docker run -d \
              --name todo-app \
              --restart always \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

            # Usuniecie starych obrazow
            docker image prune -f

      - name: Verify deployment
        run: |
          sleep 10
          curl --fail http://$\{\{ secrets.EC2_HOST }}:3000/health

      - name: Send email on deploy success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: email-smtp.eu-central-1.amazonaws.com
          server_port: 587
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          subject: "✅ Deploy SUCCESS - ${{ github.repository }}"
          body: |
            Deployment successful!
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            App URL: http://$\{\{ secrets.EC2_HOST }}:3000
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: devops@${{ secrets.SES_DOMAIN }}

      - name: Send email on deploy failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: email-smtp.eu-central-1.amazonaws.com
          server_port: 587
          username: ${{ secrets.SES_SMTP_USERNAME }}
          password: ${{ secrets.SES_SMTP_PASSWORD }}
          subject: "❌ Deploy FAILED - ${{ github.repository }}"
          body: |
            Deployment failed!
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: devops@${{ secrets.SES_DOMAIN }}
